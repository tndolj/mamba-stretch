<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="78%" cy="6%" r="120%">
      <stop offset="0%" stop-color="#1b1a16"/>
      <stop offset="55%" stop-color="#0a0a0b"/>
      <stop offset="100%" stop-color="#070708"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f9d27a"/>
      <stop offset="55%" stop-color="#f3b425"/>
      <stop offset="100%" stop-color="#d9930a"/>
